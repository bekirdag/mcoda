name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NPM_CONFIG_PROVENANCE: "true"

jobs:
  package:
    name: Package (${{ matrix.archive }})
    runs-on: ${{ startsWith(matrix.os, 'ubuntu-') && !endsWith(matrix.os, '-arm') && fromJSON('["self-hosted","Linux","X64","wodo-ci"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            archive: mcoda-linux-x64-gnu
          - os: ubuntu-22.04
            archive: mcoda-linux-x64-musl
          - os: ubuntu-22.04
            archive: mcoda-linux-arm64-gnu
          - os: macos-15-intel
            archive: mcoda-darwin-x64
          - os: macos-latest
            archive: mcoda-darwin-arm64
          - os: windows-latest
            archive: mcoda-win32-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm -r run build

      - name: Run tests
        run: node tests/all.js

      - name: Pack npm tarballs
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { packTarballs } from './scripts/pack-npm-tarballs.js';
          packTarballs();
          const repeat = mkdtempSync(path.join(os.tmpdir(), 'mcoda-release-repeat-'));
          try {
            packTarballs({dest: repeat});
            assert.equal(readFileSync('artifacts/package-artifacts.json', 'utf8'), readFileSync(path.join(repeat, 'package-artifacts.json'), 'utf8'));
          } finally { rmSync(repeat, {recursive: true, force: true}); }
          JS

      - name: Bundle release archive
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/${{ matrix.archive }}.tar.gz" -C artifacts .

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}.tar.gz

  qualify-terminal:
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: mcoda-linux-x64-gnu
          path: release
      - name: Install the exact publication artifacts on this platform
        shell: bash
        run: |
          mkdir -p artifacts/qualified
          tar -xzf release/mcoda-linux-x64-gnu.tar.gz -C artifacts/qualified
          node scripts/verify-codali-package-install.mjs --artifacts-dir artifacts/qualified --output artifacts/codali-clean-install.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codali-release-install-${{ matrix.os }}-node${{ matrix.node }}
          path: artifacts/codali-clean-install.json

  publish-npm:
    needs: [package, qualify-terminal]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: pnpm install

      - name: Build
        run: pnpm -r run build

      - name: Packaging guardrails
        run: pnpm --filter mcoda run pack:verify

      - uses: actions/download-artifact@v4
        with:
          name: mcoda-linux-x64-gnu
          path: release

      - name: Unpack the already-qualified publication artifacts
        run: |
          mkdir -p artifacts/qualified
          tar -xzf release/mcoda-linux-x64-gnu.tar.gz -C artifacts/qualified

      - name: Verify tag matches package versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.TAG.replace(/^v/, '');
          const packages = [
            'packages/shared',
            'packages/db',
            'packages/agents',
            'packages/generators',
            'packages/integrations',
            'packages/core',
            'packages/agent-setup',
            'packages/cli',
            'packages/codali',
            'packages/mswarm'
          ];

          const mismatches = [];
          for (const dir of packages) {
            const pkgPath = path.join(dir, 'package.json');
            const version = JSON.parse(fs.readFileSync(pkgPath, 'utf8')).version;
            if (version !== tag) {
              mismatches.push(`${dir}: ${version}`);
            }
          }

          if (mismatches.length) {
            console.error(
              `Tag v${tag} does not match package versions:\n${mismatches.join('\n')}`
            );
            process.exit(1);
          }

          console.log(`Tag matches all package versions: ${tag}`);
          NODE

      - name: Install OIDC-compatible npm
        run: npm install -g npm@11.18.0

      - name: Publish packages (OIDC)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          MCODA_PUBLISH_AGENT_SETUP: "1"
          MCODA_PUBLISH_CODALI: "1"
          MCODA_PUBLISH_ARTIFACTS_DIR: artifacts/qualified
        run: |
          pnpm run release:publish:npm
